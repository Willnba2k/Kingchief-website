<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KingChief</title>
  <link rel="icon" type="image/gif" href="https://cdn.discordapp.com/attachments/1185872697671024702/1406499749670027314/Untitled_design_12.gif">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      text-align: center;
    }
    header {
      position: relative;
      width: 100%;
    }
    header img.banner {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    header .logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 120px;
      width: auto;
    }
    .socials {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .socials a img {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 0 4px white);
    }
    .vods {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .vod {
      position: relative;
      cursor: pointer;
    }
    .vod img.thumbnail {
      width: 100%;
      height: auto;
      border-radius: 6px;
    }
    .vod .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 50px;
      color: white;
      text-shadow: 0 0 10px black;
      pointer-events: none;
    }
    .vod .share {
      display: block;
      margin-top: 6px;
      background: #444;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    /* Popup overlay */
    .popup {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .popup iframe {
      width: 90%;
      max-width: 800px;
      height: 55%;
      border: none;
      background: #000;
    }
    .popup .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 30px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <img class="banner" src="https://cdn.discordapp.com/attachments/1185872697671024702/1406517652863713423/banner.jpg" alt="KingChief Banner">
    <img class="logo" src="https://cdn.discordapp.com/attachments/1185872697671024702/1406499749670027314/Untitled_design_12.gif" alt="KingChief Logo">
  </header>

  <div class="socials">
    <a href="https://twitter.com/ChiefzBlock" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter"></a>
    <a href="https://instagram.com/kingchiefx" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram"></a>
    <a href="https://www.youtube.com/@KingChoif" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube"></a>
    <a href="https://tiktok.com/@kingchoif" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046120.png" alt="TikTok"></a>
    <a href="https://discord.gg/JsUVx2XWkD" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png" alt="Discord"></a>
    <a href="https://kick.com/kingchief" target="_blank"><img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/kick-streaming-platform-logo-icon.png" alt="Kick"></a>
  </div>

  <div class="vods">
    <div class="vod" data-id="-mYf8b-Y1cY">
      <img class="thumbnail" src="https://img.youtube.com/vi/-mYf8b-Y1cY/hqdefault.jpg" alt="VOD">
      <div class="play-button">▶</div>
      <button class="share">Share</button>
    </div>
    <div class="vod" data-id="gN5cOgRUrmw">
      <img class="thumbnail" src="https://img.youtube.com/vi/gN5cOgRUrmw/hqdefault.jpg" alt="VOD">
      <div class="play-button">▶</div>
      <button class="share">Share</button>
    </div>
    <div class="vod" data-id="kizZ4EX8vSw">
      <img class="thumbnail" src="https://img.youtube.com/vi/kizZ4EX8vSw/hqdefault.jpg" alt="VOD">
      <div class="play-button">▶</div>
      <button class="share">Share</button>
    </div>
    <!-- repeat for more videos -->
  </div>

  <!-- Popup Overlay -->
  <div class="popup" id="videoPopup">
    <span class="close" onclick="closePopup()">&times;</span>
    <iframe id="popupIframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>

  <script>
    const vods = document.querySelectorAll('.vod');
    const popup = document.getElementById('videoPopup');
    const popupIframe = document.getElementById('popupIframe');

    vods.forEach(vod => {
      const vid = vod.dataset.id;
      const shareBtn = vod.querySelector('.share');

      // Clicking anywhere on the thumbnail opens popup
      vod.addEventListener('click', (e) => {
        if (e.target.classList.contains('share')) return; // don't trigger on share button
        popup.style.display = 'flex';
        popupIframe.src = "https://www.youtube.com/embed/" + vid + "?autoplay=1&rel=0";
      });

      // Share button copies link
      shareBtn.addEventListener('click', async (e) => {
        e.stopPropagation(); // prevent popup
        const link = "https://youtu.be/" + vid;
        try {
          await navigator.clipboard.writeText(link);
          alert("Copied: " + link);
        } catch (err) {
          alert("Copy failed, here’s the link: " + link);
        }
      });
    });

    function closePopup() {
      popup.style.display = 'none';
      popupIframe.src = ""; // stop video
    }

    // Close when clicking outside video
    popup.addEventListener('click', (e) => {
      if (e.target === popup) closePopup();
    });
  </script>
</body>
</html>
