<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KingChief</title>
  <link rel="icon" type="image/gif" href="https://i.ibb.co/4rrGbZt/Untitled-design-12.gif">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0f0f0f;
      color: white;
      text-align: center;
    }
    header {
      position: relative;
      width: 100%;
      height: 250px;
      background: url('https://i.ibb.co/1YPvqNQJ/banner-jpeg.png') no-repeat center center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    header img.logo {
      width: 140px;
      height: auto;
      position: absolute;
      bottom: -70px;
      border-radius: 50%;
      border: 4px solid white;
      background: black;
    }
    main {
      padding: 100px 20px 40px;
    }
    .socials {
      margin: 20px 0;
    }
    .socials a img {
      width: 45px;
      height: 45px;
      margin: 0 12px;
      filter: drop-shadow(0px 0px 6px black) brightness(1.2);
    }
    .vods {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .vod {
      background: #1a1a1a;
      padding: 10px;
      border-radius: 10px;
      transition: transform 0.2s;
    }
    .vod:hover {
      transform: scale(1.03);
    }
    .vod iframe {
      width: 100%;
      height: 180px;
      border-radius: 10px;
    }
    footer {
      margin-top: 50px;
      padding: 20px;
      background: #111;
    }
  </style>
</head>
<body>
  <!-- Header with banner -->
  <header>
    <img src="https://i.ibb.co/4rrGbZt/Untitled-design-12.gif" alt="KingChief Logo" class="logo">
  </header>

  <!-- Main -->
  <main>
    <h1>Welcome to KingChief's Official Website</h1>

    <!-- Socials -->
    <div class="socials">
      <a href="https://twitter.com/ChiefzBlock" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter"></a>
      <a href="https://instagram.com/kingchiefx" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram"></a>
      <a href="https://www.youtube.com/@KingChoif" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube"></a>
      <a href="https://www.tiktok.com/@kingchoif" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok"></a>
      <a href="https://discord.gg/JsUVx2XWkD" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png" alt="Discord"></a>
    </div>

    <!-- VOD Section -->
    <h2>Latest VODs</h2>
    <div class="vods" id="vods"></div>
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2025 KingChief. All rights reserved.</p>
  </footer>

  <script>
    // YouTube VODs fetch
    async function loadVods() {
      const vodsContainer = document.getElementById("vods");
      try {
        const res = await fetch("https://www.googleapis.com/youtube/v3/search?key=YOUR_API_KEY&channelId=UCp4m6OY7z_SQm8lbNnPtT-w&order=date&part=snippet&type=video&maxResults=6");
        const data = await res.json();
        vodsContainer.innerHTML = "";
        data.items.forEach(item => {
          const videoId = item.id.videoId;
          const thumb = item.snippet.thumbnails.high.url;
          const div = document.createElement("div");
          div.className = "vod";
          div.innerHTML = `
            <iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>
            <p>${item.snippet.title}</p>
          `;
          vodsContainer.appendChild(div);
        });
      } catch (e) {
        console.error("Error loading VODs:", e);
        vodsContainer.innerHTML = "<p>Unable to load videos.</p>";
      }
    }
    loadVods();
  </script>
</body>
</html>
