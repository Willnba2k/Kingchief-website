  <style>
    :root{
      --bg:#0f0f10; --panel:#17181b; --text:#fff; --muted:#b9b9b9;
      --brand:#f4c542;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}

    /* HERO: banner with centered GIF logo */
    .hero{
      position:relative;width:100%;height:200px;
      overflow:hidden;border-bottom:4px solid var(--brand);
    }
    .hero img.banner{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    }
    .hero img.centerLogo{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      height:130px;width:auto;filter:drop-shadow(0 0 6px rgba(0,0,0,.6));
    }
    @media (max-width:640px){
      .hero{height:180px}
      .hero img.centerLogo{height:100px}
    }

    /* Social icons (white outline/glow) */
    .socials{
      display:flex;justify-content:center;align-items:center;gap:14px;
      background:#111;border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06);
      padding:10px 12px;
    }
    .socials a{
      display:inline-flex;align-items:center;justify-content:center;
      width:36px;height:36px;border-radius:8px;background:#151515;border:1px solid rgba(255,255,255,.10);
      transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .socials a:hover{transform:translateY(-1px);background:#1d1d1d;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
    .socials img{width:22px;height:22px;display:block;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 4px #fff)}

    /* Content wrapper */
    .wrap{max-width:1240px;margin:18px auto;padding:0 14px}

    /* VOD grid */
    .vods{display:grid;gap:18px;grid-template-columns:repeat(1,minmax(0,1fr))}
    @media (min-width:600px){ .vods{grid-template-columns:repeat(2,1fr)} }
    @media (min-width:900px){ .vods{grid-template-columns:repeat(3,1fr)} }
    @media (min-width:1200px){ .vods{grid-template-columns:repeat(4,1fr)} }

    .vod{
      position:relative;
      background:var(--panel);border:1px solid rgba(255,255,255,.08);
      border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.25);
      transition:transform .15s ease, box-shadow .15s ease; cursor:pointer;
    }
    .vod:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.35)}
    .vod iframe{width:100%;aspect-ratio:16/9;border:0;display:block}

    /* Transparent overlay button to capture click (so iframe clicks open modal) */
    .vod .hit{
      position:absolute;inset:0; background:transparent; border:0; cursor:pointer;
    }

    /* Lightbox modal */
    .modal{
      position:fixed; inset:0; background:rgba(0,0,0,.85);
      display:none; align-items:center; justify-content:center; z-index:1000;
      padding:20px;
    }
    .modal.show{ display:flex }
    .modal-inner{
      position:relative; width:90vw; max-width:1100px; aspect-ratio:16/9;
      background:#000; border-radius:12px; overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.08) inset;
    }
    .modal iframe{ width:100%; height:100%; border:0; display:block; }
    .close{
      position:absolute; top:-46px; right:0;
      background:#fff; color:#000; border:0; border-radius:999px;
      width:38px; height:38px; font-size:20px; font-weight:700; cursor:pointer;
      box-shadow:0 2px 8px rgba(0,0,0,.4);
    }
    @media (max-width:640px){
      .modal-inner{ width:96vw; }
      .close{ top:-44px; }
    }

    footer{color:var(--muted);text-align:center;padding:24px 0}
  </style>

  <!-- LIGHTBOX MODAL -->

    <div class="modal-inner">

      <iframe id="ytFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

  <script>
    // Helper to grab the YouTube ID from an embed URL
    function getIdFromEmbedSrc(src){
      // matches ".../embed/VIDEOID" possibly with params
      const m = src.match(/\\/embed\\/([^?&]+)/);
      return m ? m[1] : null;
    }

    const modal = document.getElementById('ytModal');
    const frame = document.getElementById('ytFrame');
    const closeBtn = modal.querySelector('.close');

    // Open modal on any VOD click
    document.querySelectorAll('.vod').forEach(v => {
      v.addEventListener('click', () => {
        const iframe = v.querySelector('iframe');
        const id = getIdFromEmbedSrc(iframe.src);
        if(!id) return;

        // Larger autoplaying player in modal
        frame.src = `https://www.youtube.com/embed/${id}?autoplay=1&modestbranding=1&rel=0`;
        modal.classList.add('show');
        document.body.style.overflow = 'hidden'; // prevent background scroll
      });
    });

    // Close handlers
    function closeModal(){
      modal.classList.remove('show');
      frame.src = ''; // stop playback
      document.body.style.overflow = '';
    }
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e)=>{ if(e.target === modal) closeModal(); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeModal(); });
  </script>
