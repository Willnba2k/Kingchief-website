<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KingChief</title>
  <!-- Tab Logo -->
  <link rel="icon" type="image/gif" href="https://cdn.discordapp.com/attachments/1185872697671024702/1406499749670027314/Untitled_design_12.gif?ex=68a2b077&is=68a15ef7&hm=d2160f1e0978ab033cdb21cddcd391aedf4b4ce6311e4eec72b22e4a6654ce20&" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0e0e10;
      color: white;
      text-align: center;
    }

    header {
      background-color: #18181b;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header img.banner {
      max-height: 60px;
    }

    .socials {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .socials img {
      width: 28px;
      height: 28px;
      filter: brightness(0) invert(1);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .socials img:hover {
      transform: scale(1.2);
      filter: brightness(1) invert(0) drop-shadow(0 0 6px #00ff99);
    }

    h1 {
      margin-top: 30px;
      font-size: 2rem;
    }

    .vods {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .vods iframe {
      width: 100%;
      height: 180px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <!-- KingChief Banner -->
    <img src="https://cdn.discordapp.com/attachments/1185872697671024702/1406499749670027314/Untitled_design_12.gif" alt="KingChief Banner" class="banner" />

    <!-- Platform Logos -->
    <div class="socials">
      <a href="https://kick.com/kingchief" target="_blank">
        <img src="https://kick.com/img/kick-logo.svg" alt="Kick">
      </a>
      <a href="https://www.youtube.com/@KingChoif" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube">
      </a>
      <a href="https://tiktok.com/@kingchoif" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/3046/3046120.png" alt="TikTok">
      </a>
      <a href="https://twitter.com/ChiefzBlock" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter/X">
      </a>
      <a href="https://instagram.com/kingchiefx" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/1384/1384063.png" alt="Instagram">
      </a>
      <a href="https://discord.gg/JsUVx2XWkD" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord">
      </a>
    </div>
  </header>

  <h1>Latest VODs</h1>
  <div class="vods">
    <iframe src="https://www.youtube.com/embed/-mYf8b-Y1cY" frameborder="0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/gN5cOgRUrmw" frameborder="0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/kizZ4EX8vSw" frameborder="0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/AkNPnPjgqBE" frameborder="0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/cbQofKGnqeM" frameborder="0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/9NwUa_GqYxQ" frameborder="0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/fkSVA6hLPIA" frameborder="0" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/ip9AAUY-X_s" frameborder="0" allowfullscreen></iframe>
  </div>
</body>
</html>
