<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KingChief</title>
  <link rel="icon" type="image/gif" href="https://cdn.discordapp.com/attachments/1185872697671024702/1406499749670027314/Untitled_design_12.gif">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      text-align: center;
    }
    header {
      position: relative;
      width: 100%;
    }
    header img.banner {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    header img.logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 100px;
      border: 3px solid #fff;
      border-radius: 10px;
      background: rgba(0,0,0,0.4);
    }
    .socials {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .socials a img {
      width: 32px;
      height: 32px;
      border: 2px solid white;
      border-radius: 8px;
      background: rgba(0,0,0,0.4);
      padding: 4px;
    }
    .vods, .auto-vods {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .vods iframe, .auto-vods iframe {
      width: 100%;
      height: 200px;
      border: none;
    }
    .video-card {
      background: #222;
      border-radius: 8px;
      overflow: hidden;
    }
    .video-card img {
      width: 100%;
      height: auto;
      display: block;
    }
    .video-card p {
      padding: 10px;
      font-size: 14px;
      margin: 0;
    }
  </style>
</head>
<body>
  <header>
    <img class="banner" src="https://cdn.discordapp.com/attachments/1185872697671024702/1406517652863713423/banner.jpg" alt="KingChief Banner">
    <img class="logo" src="https://cdn.discordapp.com/attachments/1185872697671024702/1406499749670027314/Untitled_design_12.gif" alt="KingChief Logo">
  </header>

  <div class="socials">
    <a href="https://twitter.com/ChiefzBlock" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter"></a>
    <a href="https://instagram.com/kingchiefx" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram"></a>
    <a href="https://www.youtube.com/@KingChoif" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube"></a>
    <a href="https://tiktok.com/@kingchoif" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046120.png" alt="TikTok"></a>
    <a href="https://discord.gg/JsUVx2XWkD" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png" alt="Discord"></a>
    <a href="https://kick.com/kingchief" target="_blank"><img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/kick-streaming-platform-logo-icon.png" alt="Kick"></a>
  </div>

  <h2>📺 Archive VODs</h2>
  <div class="vods">
    <iframe src="https://www.youtube.com/embed/-mYf8b-Y1cY" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/gN5cOgRUrmw" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/kizZ4EX8vSw" allowfullscreen></iframe>
  </div>

  <h2>🔥 Latest VODs (Auto-updating)</h2>
  <div class="auto-vods" id="autoVods"></div>

  <script>
    async function loadVods() {
      try {
        const channelId = "UCra4-XY3pIPqfIz1UOdxVqg"; // KingChiefVodz channel ID
        const response = await fetch(`https://rss2json.com/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`);
        const data = await response.json();
        const vodsContainer = document.getElementById("autoVods");

        data.items.slice(0, 8).forEach(video => {
          const videoId = video.link.split("v=")[1];
          const thumb = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
          const card = document.createElement("div");
          card.className = "video-card";
          card.innerHTML = `
            <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank">
              <img src="${thumb}" alt="${video.title}">
            </a>
            <p>${video.title}</p>
          `;
          vodsContainer.appendChild(card);
        });
      } catch (err) {
        console.error("Error loading VODs:", err);
      }
    }
    loadVods();
  </script>
</body>
</html>
