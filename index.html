<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KingChief</title>
  <link rel="icon" href="https://cdn.discordapp.com/attachments/1185872697671024702/1406499749670027314/Untitled_design_12.gif" type="image/gif" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #181818;
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    header img.logo {
      height: 60px;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }
    .socials {
      display: flex;
      gap: 12px;
    }
    .socials img {
      height: 24px;
      width: 24px;
      filter: brightness(0) invert(1);
      transition: transform 0.2s ease;
    }
    .socials img:hover {
      transform: scale(1.2);
    }
    .banner {
      text-align: center;
      margin: 20px 0;
    }
    .banner img {
      height: 150px;
    }
    .vod-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .vod {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 10px;
    }
    .vod iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
    }
    .vod-title {
      margin-top: 8px;
      font-size: 14px;
      text-align: center;
    }
    @media (max-width: 768px) {
      .banner img { height: 100px; }
      header img.logo { height: 40px; }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://cdn.discordapp.com/attachments/1185872697671024702/1406499749670027314/Untitled_design_12.gif" class="logo" alt="KingChief Logo"/>
    <nav>
      <a href="#vods">VODs</a>
      <a href="#clips">Clips</a>
      <a href="#links">Links</a>
      <a href="#schedule">Schedule</a>
    </nav>
    <div class="socials">
      <a href="https://www.youtube.com/@KingChoif" target="_blank"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/youtube.svg" alt="YouTube"></a>
      <a href="https://kick.com/kingchief" target="_blank"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/kick.svg" alt="Kick"></a>
      <a href="https://tiktok.com/@kingchoif" target="_blank"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/tiktok.svg" alt="TikTok"></a>
      <a href="https://twitter.com/ChiefzBlock" target="_blank"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/twitter.svg" alt="Twitter"></a>
      <a href="https://instagram.com/kingchiefx" target="_blank"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/instagram.svg" alt="Instagram"></a>
      <a href="https://discord.gg/JsUVx2XWkD" target="_blank"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/discord.svg" alt="Discord"></a>
    </div>
  </header>

  <div class="banner">
    <img src="https://cdn.discordapp.com/attachments/1185872697671024702/1406499749670027314/Untitled_design_12.gif" alt="Banner Logo"/>
  </div>

  <section id="vods" class="vod-grid">
    <!-- Example VODs -->
    <div class="vod">
      <iframe src="https://www.youtube.com/embed/-mYf8b-Y1cY" frameborder="0" allowfullscreen></iframe>
      <div class="vod-title">Stream 1</div>
    </div>
    <div class="vod">
      <iframe src="https://www.youtube.com/embed/gN5cOgRUrmw" frameborder="0" allowfullscreen></iframe>
      <div class="vod-title">Stream 2</div>
    </div>
    <!-- Add more VODs here -->
  </section>
</body>
</html>
