<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>King Chief — Official Website</title>

  <!-- Favicon (kept as your GIF logo for the tab icon) -->
  <link rel="icon" type="image/gif" href="https://cdn.discordapp.com/attachments/1185872697671024702/1406499749670027314/Untitled_design_12.gif"/>

  <!-- Perf hints -->
  <link rel="preconnect" href="https://i.ytimg.com"><link rel="dns-prefetch" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://api.rss2json.com"><link rel="dns-prefetch" href="https://api.rss2json.com">

  <style>
    :root{
      --bg:#0f0f10; --panel:#17181b; --text:#fff; --muted:#b9b9b9;
      --brand:#f4c542;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}

    /* HERO */
    .hero{position:relative;width:100%;height:200px;overflow:hidden;border-bottom:4px solid var(--brand);}
    .hero img.banner{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
    .hero .banner-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0e0e0e;color:#aaa;font-weight:700}
    .hero img.centerLogo{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      height:130px;width:auto;filter:drop-shadow(0 0 6px rgba(0,0,0,.6));display:block
    }
    .hero .logo-fallback{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      padding:.6rem .8rem;border-radius:10px;background:rgba(0,0,0,.6);border:2px dashed #999;color:#ddd;display:none
    }
    @media (max-width:640px){ .hero{height:180px} .hero img.centerLogo{height:100px} }

    /* Social icons (white outline/glow) */
    .socials{
      display:flex;justify-content:center;align-items:center;gap:14px;
      background:#111;border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06);
      padding:10px 12px;
    }
    .socials a{
      display:inline-flex;align-items:center;justify-content:center;
      width:36px;height:36px;border-radius:8px;background:#151515;border:1px solid rgba(255,255,255,.10);
      transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .socials a:hover{transform:translateY(-1px);background:#1d1d1d;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
    .socials img{width:22px;height:22px;display:block;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 4px #fff)}

    /* Content wrapper */
    .wrap{max-width:1240px;margin:18px auto;padding:0 14px}

    /* VOD grid */
    .vods{display:grid;gap:18px;grid-template-columns:repeat(1,minmax(0,1fr))}
    @media (min-width:600px){ .vods{grid-template-columns:repeat(2,1fr)} }
    @media (min-width:900px){ .vods{grid-template-columns:repeat(3,1fr)} }
    @media (min-width:1200px){ .vods{grid-template-columns:repeat(4,1fr)} }

    .vod{
      background:var(--panel);border:1px solid rgba(255,255,255,.08);
      border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.25);
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .vod:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.35)}

    .thumb{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
    .thumb picture,.thumb img{width:100%;height:100%;display:block;object-fit:cover}
    .playBadge{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      width:70px;height:70px;border-radius:50%;background:rgba(0,0,0,.55);
      display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.8)
    }
    .playBadge svg{width:30px;height:30px;fill:#fff;margin-left:3px}

    .meta{padding:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    .btn{
      background:#2a2b30;color:#fff;border:1px solid rgba(255,255,255,.12);
      border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;
      transition:background .15s ease, transform .15s ease;
    }
    .btn:hover{background:#34363c;transform:translateY(-1px)}
    .btn:active{transform:none}

    /* Lightbox modal (not full screen) */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);z-index:1000;padding:20px}
    .modal.show{display:flex}
    .modal-inner{
      position:relative;width:90vw;max-width:1100px;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.08) inset;
    }
    .modal iframe{width:100%;height:100%;border:0;display:block}
    .close{
      position:absolute;top:-46px;right:0;background:#fff;color:#000;border:0;border-radius:999px;
      width:38px;height:38px;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)
    }
    @media (max-width:640px){ .modal-inner{width:96vw} .close{top:-44px} }

    h2{max-width:1240px;margin:20px auto 8px;padding:0 14px;color:#f4c542;font-weight:700}
    footer{color:var(--muted);text-align:center;padding:24px 0}
  </style>
</head>
<body>

  <!-- HERO (loads ibb.co links, auto-resolves real image) -->
  <header class="hero">
    <img class="banner" id="kcBanner" alt="King Chief Banner">
    <div class="banner-fallback" id="kcBannerFallback">Banner image unavailable</div>

    <img class="centerLogo" id="kcLogo" alt="King Chief Logo">
    <div class="logo-fallback" id="kcLogoFallback">Logo unavailable</div>
  </header>

  <!-- SOCIALS -->
  <nav class="socials" aria-label="Social links">
    <a href="https://twitter.com/ChiefzBlock" target="_blank" rel="noopener" aria-label="Twitter">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter">
    </a>
    <a href="https://instagram.com/kingchiefx" target="_blank" rel="noopener" aria-label="Instagram">
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram">
    </a>
    <a href="https://www.youtube.com/@KingChoif" target="_blank" rel="noopener" aria-label="YouTube">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube">
    </a>
    <a href="https://tiktok.com/@kingchoif" target="_blank" rel="noopener" aria-label="TikTok">
      <img src="https://cdn-icons-png.flaticon.com/512/3046/3046120.png" alt="TikTok">
    </a>
    <a href="https://discord.gg/JsUVx2XWkD" target="_blank" rel="noopener" aria-label="Discord">
      <img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png" alt="Discord">
    </a>
    <a href="https://kick.com/kingchief" target="_blank" rel="noopener" aria-label="Kick">
      <img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/kick-streaming-platform-logo-icon.png" alt="Kick">
    </a>
  </nav>

  <!-- VODS -->
  <h2>🔥 Latest VODs</h2>
  <main class="wrap">
    <section id="vodGrid" class="vods" aria-label="VODs"></section>
  </main>

  <!-- LIGHTBOX MODAL -->
  <div id="ytModal" class="modal" role="dialog" aria-modal="true" aria-label="Video player">
    <div class="modal-inner">
      <button class="close" aria-label="Close">✕</button>
      <iframe id="ytFrame" src="" allow="autoplay; encrypted-media; picture-in-picture; clipboard-write" allowfullscreen playsinline></iframe>
    </div>
  </div>

  <footer>© 2025 King Chief. All rights reserved.</footer>

  <script>
    /* =============================
       1) BANNER & LOGO (ibb.co auto-resolve)
       ============================= */
    const IBB_BANNER_PAGE = "https://ibb.co/BHQzZJ3K";  // your 1st link (banner)
    const IBB_LOGO_PAGE   = "https://ibb.co/3ZZqxyd";   // your 2nd link (logo)

    const bannerImg = document.getElementById('kcBanner');
    const bannerFallback = document.getElementById('kcBannerFallback');
    const logoImg = document.getElementById('kcLogo');
    const logoFallback = document.getElementById('kcLogoFallback');

    async function resolveIbbDirect(url){
      // Try to fetch the page and extract the og:image (direct i.ibb.co URL).
      try{
        const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
        const html = await res.text();
        const m = html.match(/<meta[^>]+property=["']og:image["'][^>]+content=["'](https:\/\/i\.ibb\.co\/[^"']+)["']/i);
        return m ? m[1] : null;
      }catch(_){
        return null;
      }
    }
    async function loadIbbImage(pageUrl, imgEl, fallbackEl){
      // If user accidentally pasted a direct i.ibb.co URL already, just use it.
      if (/^https:\/\/i\.ibb\.co\//.test(pageUrl)) {
        imgEl.src = pageUrl;
        imgEl.onload = ()=>{ imgEl.style.display='block'; fallbackEl.style.display='none'; };
        imgEl.onerror = ()=>{ imgEl.style.display='none'; fallbackEl.style.display='flex'; };
        return;
      }
      // Otherwise resolve from the ibb.co page
      const direct = await resolveIbbDirect(pageUrl);
      if (direct){
        imgEl.src = direct;
        imgEl.onload = ()=>{ imgEl.style.display='block'; fallbackEl.style.display='none'; };
        imgEl.onerror = ()=>{ imgEl.style.display='none'; fallbackEl.style.display='flex'; };
      } else {
        // Couldn’t resolve (CORS blocked or page changed)
        imgEl.style.display='none';
        fallbackEl.style.display='flex';
      }
    }
    loadIbbImage(IBB_BANNER_PAGE, bannerImg, bannerFallback);
    loadIbbImage(IBB_LOGO_PAGE,   logoImg,   logoFallback);

    /* =============================
       2) VODs: auto (channel) + manual
       ============================= */
    const CHANNEL_ID = "UC_3hI1O0YCF-LX0bpFzOkOw"; // @KingChiefVodz
    const FEED_URL = "https://www.youtube.com/feeds/videos.xml?channel_id=" + CHANNEL_ID;
    const FEED_API = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(FEED_URL);
    const MAX_AUTO = 24;

    // Your old manual VODs (kept)
    const OLD_VIDS = [
      "-mYf8b-Y1cY","gN5cOgRUrmw","kizZ4EX8vSw","AkNPnPjgqBE","cbQofKGnqeM","9NwUa_GqYxQ",
      "fkSVA6hLPIA","ip9AAUY-X_s","5Hhg5_0VSEQ","oYcgSVNOe70","Rx4B8hoptBU","unPPNeVQ3oY",
      "XjRv9s5I7oc","G1hoHYYitV4","RNDgzcxIBdM","1-fnXPqTHCU","f-Tk9YtNaN8","oBqgCiqf1KQ",
      "lUvvyfQIbfs","OaE2r5Q_sHo","MHlZhGa5iTg","5pf8wR_wKhM"
    ];

    const grid  = document.getElementById('vodGrid');
    const modal = document.getElementById('ytModal');
    const frame = document.getElementById('ytFrame');
    const closeBtn = modal.querySelector('.close');

    function addCard(id, title){
      if(!id) return;
      const card  = document.createElement('div'); card.className = 'vod';
      const thumb = document.createElement('div'); thumb.className = 'thumb';

      // Robust thumbnail with fallbacks (WebP maxres → JPG maxres → HQ JPG)
      const picture = document.createElement('picture');

      const srcWebp = document.createElement('source');
      srcWebp.type = 'image/webp';
      srcWebp.srcset = `https://i.ytimg.com/vi_webp/${id}/maxresdefault.webp`;

      const srcJpgMax = document.createElement('source');
      srcJpgMax.type = 'image/jpeg';
      srcJpgMax.srcset = `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;

      const img = document.createElement('img');
      img.alt = title || 'VOD';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.src = `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;
      img.onerror = function(){ this.onerror=null; this.src=`https://i.ytimg.com/vi/${id}/hqdefault.jpg`; };
      img.style.opacity = '0'; img.style.transition = 'opacity .25s ease';
      img.addEventListener('load', ()=> img.style.opacity = '1');

      picture.append(srcWebp, srcJpgMax, img);
      thumb.appendChild(picture);

      const play = document.createElement('div');
      play.className = 'playBadge';
      play.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
      thumb.appendChild(play);

      // Click thumbnail to open modal
      thumb.addEventListener('click', ()=> openVideo(id));

      // Buttons row
      const meta = document.createElement('div'); meta.className = 'meta';
      const openBtn = document.createElement('button'); openBtn.className = 'btn'; openBtn.textContent = 'Play';
      openBtn.addEventListener('click', ()=> openVideo(id));

      const shareBtn = document.createElement('button'); shareBtn.className = 'btn'; shareBtn.textContent = 'Share';
      shareBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const url = `https://youtu.be/${id}`;
        try {
          if (navigator.share) { await navigator.share({ title: title || 'King Chief VOD', url }); }
          else { await navigator.clipboard.writeText(url); alert('Copied: ' + url); }
        } catch(_) {}
      });

      meta.append(openBtn, shareBtn);
      card.append(thumb, meta);
      grid.appendChild(card);
    }

    function openVideo(id){
      frame.src = `https://www.youtube.com/embed/${id}?autoplay=1&modestbranding=1&rel=0&playsinline=1`;
      modal.classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function closeModal(){
      modal.classList.remove('show');
      frame.src = '';
      document.body.style.overflow = '';
    }
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e)=>{ if(e.target === modal) closeModal(); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeModal(); });

    (async function buildVods(){
      const seen = new Set();

      // Auto (new uploads)
      try {
        const res = await fetch(FEED_API, { cache: "no-store" });
        const data = await res.json();
        const items = (data.items || []).slice(0, MAX_AUTO);
        for (const item of items) {
          const id = (item.link && item.link.split("v=")[1]) || "";
          if (!id || seen.has(id)) continue;
          seen.add(id);
          addCard(id, item.title || 'VOD');
        }
      } catch (e) {
        console.warn('Auto feed failed (showing manual only):', e);
      }

      // Manual (old uploads)
      for (const id of OLD_VIDS) {
        if (seen.has(id)) continue;
        seen.add(id);
        addCard(id, 'VOD');
      }
    })();
  </script>
</body>
</html>
