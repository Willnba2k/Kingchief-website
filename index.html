<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>King Chief — Official Website</title>
  <link rel="icon" type="image/gif" href="https://cdn.discordapp.com/attachments/1185872697671024702/1406499749670027314/Untitled_design_12.gif?ex=68a2b077&is=68a15ef7&hm=d2160f1e0978ab033cdb21cddcd391aedf4b4ce6311e4eec72b22e4a6654ce20&" />
  <style>
    :root{ --brand:#f4c542; --accent:#00ffae; --bg1:#0f0f0f; --bg2:#1f1f1f; --text:#f0f0f0; --muted:#a9a9a9; --card:rgba(255,255,255,.05); }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2));}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}

    /* Header banner with centered GIF logo */
    .hero{position:relative;width:100%;}
    .hero img.banner{width:100%;height:180px;object-fit:cover;display:block}
    .hero img.center-logo{position:absolute;inset:0;margin:auto;top:50%;left:50%;transform:translate(-50%,-50%);height:90px;width:auto;filter:drop-shadow(0 0 10px rgba(0,0,0,.6));}

    /* Socials row */
    .socials{display:flex;justify-content:center;gap:16px;align-items:center;padding:12px 0;background:#111}
    .socials img{width:28px;height:28px;display:block;filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 2px #fff);} /* white outline/glow */

    /* VOD grid */
    .vods{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;padding:16px;max-width:1300px;margin:0 auto}
    .vods iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  </style>
</head>
<body>
  <!-- Header banner + centered logo -->
  <div class="hero">
    <img class="banner" src="https://cdn.discordapp.com/attachments/1185872697671024702/1406517652863713423/banner.jpg?ex=68a2c124&is=68a16fa4&hm=a3c64619e7265620b7d390340134b515ef2ebef34dac7dfc09c8cc41ad7eea12&" alt="King Chief Banner" />
