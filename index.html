<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KingChief</title>
  <link rel="icon" type="image/gif" href="https://cdn.discordapp.com/attachments/1185872697671024702/1406499749670027314/Untitled_design_12.gif">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      text-align: center;
    }
    header {
      width: 100%;
    }
    header img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .logo {
      margin-top: -60px;
      text-align: center;
    }
    .logo img {
      width: 120px;
      height: auto;
      border-radius: 50%;
      border: 3px solid #fff;
      background: #111;
    }
    .socials {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .socials a img {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 0 3px #fff);
    }
    .vods {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .vod {
      background: #222;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .vod:hover {
      transform: scale(1.03);
    }
    .vod img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }
    .vod-title {
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
    }
    /* Popout player */
    .player-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .player-overlay iframe {
      width: 80%;
      max-width: 900px;
      height: 500px;
      border: none;
      border-radius: 8px;
    }
    .close-btn {
      position: absolute;
      top: 20px; right: 30px;
      font-size: 30px;
      cursor: pointer;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://cdn.discordapp.com/attachments/1185872697671024702/1406517652863713423/banner.jpg" alt="KingChief Banner">
  </header>

  <div class="logo">
    <img src="https://cdn.discordapp.com/attachments/1185872697671024702/1406499749670027314/Untitled_design_12.gif" alt="KingChief Logo">
  </div>

  <div class="socials">
    <a href="https://twitter.com/ChiefzBlock" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter"></a>
    <a href="https://instagram.com/kingchiefx" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram"></a>
    <a href="https://www.youtube.com/@KingChoif" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube"></a>
    <a href="https://tiktok.com/@kingchoif" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046120.png" alt="TikTok"></a>
    <a href="https://discord.gg/JsUVx2XWkD" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png" alt="Discord"></a>
    <a href="https://kick.com/kingchief" target="_blank"><img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/kick-streaming-platform-logo-icon.png" alt="Kick"></a>
  </div>

  <h2>Latest VODs</h2>
  <div class="vods" id="vods"></div>

  <!-- Popout player -->
  <div class="player-overlay" id="playerOverlay">
    <span class="close-btn" onclick="closePlayer()">&times;</span>
    <iframe id="playerFrame" src="" allowfullscreen></iframe>
  </div>

  <script>
    const vodsContainer = document.getElementById('vods');
    const manualVods = [
      "https://www.youtube.com/embed/-mYf8b-Y1cY",
      "https://www.youtube.com/embed/gN5cOgRUrmw",
      "https://www.youtube.com/embed/kizZ4EX8vSw",
      "https://www.youtube.com/embed/AkNPnPjgqBE"
    ];

    function createVodElement(videoId, title) {
      const div = document.createElement('div');
      div.className = 'vod';
      div.innerHTML = `
        <img src="https://img.youtube.com/vi/${videoId}/maxresdefault.jpg" alt="${title}">
        <div class="vod-title">${title}</div>
      `;
      div.onclick = () => openPlayer(videoId);
      return div;
    }

    // Popout player
    function openPlayer(videoId) {
      document.getElementById('playerOverlay').style.display = 'flex';
      document.getElementById('playerFrame').src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
    }
    function closePlayer() {
      document.getElementById('playerOverlay').style.display = 'none';
      document.getElementById('playerFrame').src = "";
    }

    // Load manual vods
    manualVods.forEach(url => {
      const id = url.split("/embed/")[1];
      vodsContainer.appendChild(createVodElement(id, "Old VOD"));
    });

    // Load new VODs from channel
    fetch("https://www.youtube.com/feeds/videos.xml?channel_id=UC9pXz1Egw3J5DdFZL2tJwBA")
      .then(res => res.text())
      .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
      .then(data => {
        const items = data.querySelectorAll("entry");
        items.forEach(item => {
          const link = item.querySelector("link").getAttribute("href");
          const id = link.split("v=")[1];
          const title = item.querySelector("title").textContent;
          vodsContainer.appendChild(createVodElement(id, title));
        });
      });
  </script>
</body>
</html>
